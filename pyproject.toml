[project]
name = "ampr-core-backend"
version = "2026.03"
description = ""
authors = [
    {name = "Chris Georgen",email = "c-georgen@users.noreply.github.com"}
]
readme = "README.md"
requires-python = "<3.15,>=3.10"
dependencies = [
    "aiogram (>=3.23.0,<4.0.0)",
    "convex (>=0.7.0,<0.8.0)",
    "fastapi (>=0.115.14,<0.116.0)",
    "gel (>=3.1.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "markdownify (>=1.2.2,<2.0.0)",
    "mistralai (>=1.9.11,<2.0.0)",
    "phonenumbers (>=9.0.10,<10.0.0)",
    "pydantic-ai (>=1.0.9,<2.0.0)",
    "pydantic-extra-types (>=2.10.5,<3.0.0)",
    "pydantic[email] (>=2.11.7,<3.0.0)",
    "pycountry (>=24.6.1,<25.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "resend (>=2.13.1,<3.0.0)",
    "trafilatura (>=2.0.0,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    ]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src", from = "." }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[tool.pyright]
venvPath = "/home/cgeorgen/.cache/pypoetry/virtualenvs"
venv = "ampr-core-backend-xqTO7KpO-py3.10"

[tool.ampr]
# Short, human-readable summary of what shipped in the current `[project].version`.
# Surfaced by the amprChat `get_help_overview` tool. Leave empty to omit the line.
latest_update_summary = "Included various bug fixes and shipped educational modules and games"
# URL pointing to release notes / changelog for the current version.
# Surfaced as a clickable link in `get_help_overview`. Leave empty to omit the link.
latest_update_link = "https://ampersand.featurebase.app/changelog/update-1-or-ampr-0"
