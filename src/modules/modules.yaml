# Third-Party Module Configuration
# Defines modules that can be invoked via &mention syntax or automatically by amprChat

modules:
  - name: "defianalyst"
    trigger: "&defianalyst"
    path: "src.modules.defianalyst"
    enabled: true
    description: "Cryptocurrency market data analyst powered by CoinGecko API"
    intents:
      - "Current price, market cap, or 24h volume for any cryptocurrency or token"
      - "Historical price data for a specific date (within last 365 days)"
      - "Top performing coins — gainers or losers over 1h, 24h, 7d, 14d, 30d, 60d, or 1y"
      - "Compare price performance between multiple cryptocurrencies over a date range"
      - "Rank coins by market capitalization or fully diluted valuation (FDV)"
      - "All-time high (ATH) or all-time low (ATL) data with dates and percentage changes"
      - "Search for a coin by name or symbol"
      - "Any question mentioning a specific token/coin name or symbol (e.g., BTC, ETH, SOL)"
      - "Price alerts or notifications for a cryptocurrency (e.g., notify me when ETH hits $3k)"
    response_instructions: |
      Lead with the current price and 24h change.
      Use currency formatting with appropriate precision (e.g., $50,123.45 for BTC, $0.5823 for smaller tokens).
      For comparisons, use a ranked list format.
      Keep it to 2-3 sentences for single asset queries.
    notification_types:
      - name: "price_change_24h"
        description: "24-hour price change exceeds threshold"
        default_enabled: true
        priority: "medium"
      - name: "price_change_7d"
        description: "7-day price change exceeds threshold"
        default_enabled: true
        priority: "medium"
      - name: "price_threshold"
        description: "Asset crosses a specific price target"
        default_enabled: true
        priority: "high"

  - name: "oracle"
    trigger: "&oracle"
    path: "src.modules.oracle"
    enabled: true
    description: "Prediction markets specialist powered by Polymarket data"
    constraints:
      - "Does NOT support notifications or alerts — do not offer to set notifications for prediction market events"
    intents:
      - "Probability or likelihood of a future event (elections, rate decisions, economic outcomes)"
      - "Prediction market prices or odds for tracked events"
      - "Will X happen? questions about future economic, political, or financial events"
      - "Interest rate forecasts (e.g., Fed, ECB rate decisions)"
      - "Macro-economic predictions and event probabilities"
    response_instructions: |
      Lead with the probability and market consensus — state what the market predicts first.
      Include price movement trends (1D/1W/1M) when available to show momentum.
      Do not emphasize volume or open interest unless the user specifically asked.
      Frame probabilities as the market's prediction, not as fact.
      Keep it to 2-3 sentences max.

  - name: "lens"
    trigger: "&lens"
    path: "src.modules.lens"
    enabled: false
    description: "RAG-powered author agent — search and interact with an author's indexed content"
    intents:
      - "Search an author's writings, blogs, or newsletters by topic"
      - "Get an author's opinion or analysis on a financial topic"
      - "Quote or paraphrase from an author's indexed content"
