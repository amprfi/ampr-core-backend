# Third-Party Module Configuration
# Defines modules that can be invoked via &mention syntax or automatically by amprChat

modules:
  - name: "defianalyst"
    trigger: "&defianalyst"
    path: "src.modules.defianalyst"
    enabled: true
    description: "Cryptocurrency market data analyst powered by CoinGecko API"
    intents:
      - "crypto prices"
      - "token market cap"
      - "trading volume"
      - "historical prices"
      - "top gainers/losers"
      - "ATH/ATL data"

  - name: "oracle"
    trigger: "&oracle"
    path: "src.modules.oracle"
    enabled: true
    description: "Prediction markets specialist for economic and financial predictions"
    intents:
      - "prediction forecast"
      - "event probabilities"
      - "economic forecast"
      - "macro predictions"
